name: fetch-source

# GitHub runner downloads the source; the local machine only downloads the
# small artifact if you choose to. This is intentionally manual: AOSP is tens
# of GB and must never be fetched by a bare push/PR workflow.
on:
  workflow_dispatch:
    inputs:
      host:
        description: "codeberg / gitlab / github / all"
        required: true
        default: "codeberg"
        type: choice
        options: [codeberg, gitlab, github, all]
      group:
        description: "system / apps / ecosystem / tools (leave empty when using only)"
        required: false
        default: "apps"
        type: choice
        options: ["", system, apps, ecosystem, tools]
      only:
        description: "repo or path glob (e.g. android_packages_apps_Settings); overrides group"
        required: false
        default: ""
        type: string
      depth:
        description: "git depth; 1 is small, 0 is full history"
        required: true
        default: "1"
        type: choice
        options: ["1", "0"]
      retention_days:
        description: "artifact retention"
        required: true
        default: "7"
        type: choice
        options: ["1", "3", "7", "14", "30"]

permissions:
  contents: read

concurrency:
  group: fetch-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate inventory
        run: python3 scripts/verify_projects.py

      - name: Fetch selected source on GitHub runner
        env:
          HOST: ${{ inputs.host }}
          GROUP: ${{ inputs.group }}
          ONLY: ${{ inputs.only }}
          DEPTH: ${{ inputs.depth }}
        run: |
          set -euo pipefail
          args=(--host "$HOST" --dest sources --depth "$DEPTH" --jobs 2)
          if [ -n "$ONLY" ]; then
            args+=(--only "$ONLY")
          elif [ -n "$GROUP" ]; then
            args+=(--group "$GROUP")
          else
            echo "Set either group or only; refusing a full-tree download." >&2
            exit 2
          fi
          python3 scripts/fetch_sources.py "${args[@]}"

      - name: Summarize
        run: |
          set -euo pipefail
          du -sh sources
          find sources -name .git -type d \
            | sed 's#/.git$##' | sort > source-list.txt
          wc -l source-list.txt
          cat source-list.txt

      - name: Upload source as artifact
        uses: actions/upload-artifact@v4
        with:
          name: onyx-source-${{ github.run_number }}
          path: |
            sources/
            source-list.txt
          retention-days: ${{ fromJSON(inputs.retention_days) }}
          if-no-files-found: error
